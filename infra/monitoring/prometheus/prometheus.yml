# 보안 대시보드(파트 B)용 Prometheus 설정.
# 로컬에서 uvicorn으로 띄운 API(호스트 8000번)의 /metrics를 수집한다.
global:
  scrape_interval: 5s      # 데모에서 그래프가 빨리 바뀌도록 짧게
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:                   # 울린 경보를 Alertmanager로 넘긴다(디스코드 전송)
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: teamup-api
    metrics_path: /metrics
    authorization:            # .env의 METRICS_TOKEN (compose가 컨테이너 시작 때 이 파일로 쓴다)
      type: Bearer
      credentials_file: /prometheus/metrics_token
    static_configs:
      - targets: ["host.docker.internal:8000"]
