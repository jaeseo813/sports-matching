services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: teamup
      MARIADB_USER: teamup
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro  # 테스트 전용 DB(teamup_test) 생성
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  # 기본은 db만 띄우고 uvicorn은 로컬에서 실행한다. API까지 컨테이너로 보려면:
  #   docker compose --profile api up -d
  api:
    profiles: ["api"]
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+asyncmy://teamup:${DB_PASSWORD:-change-me}@db:3306/teamup
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  # 보안 대시보드(파트 B). 평소에는 안 뜨고, 필요할 때만:
  #   docker compose --profile monitoring up -d   → Grafana http://127.0.0.1:3000
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.16.0
    # /metrics 토큰을 .env에서 받아 파일로 쓴 뒤 시작한다(토큰은 레포·이미지에 남지 않는다)
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$METRICS_TOKEN" > /prometheus/metrics_token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/monitoring/prometheus:/etc/prometheus:ro
    extra_hosts: ["host.docker.internal:host-gateway"]  # 호스트의 uvicorn(8000)을 수집
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [alertmanager]

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.34.2
    # 디스코드 웹훅 주소를 .env에서 받아 파일로 쓴 뒤 시작한다(주소는 레포·이미지에 남지 않는다).
    # 비어 있으면 아무 데도 보내지 않는 설정으로 띄운다.
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -n "$$DISCORD_WEBHOOK_URL" ]; then
        printf '%s' "$$DISCORD_WEBHOOK_URL" > /alertmanager/discord_webhook && config=alertmanager.yml;
        else echo "DISCORD_WEBHOOK_URL 없음: 디스코드로 보내지 않습니다" && config=alertmanager-off.yml; fi &&
        exec /bin/alertmanager --config.file=/etc/alertmanager/$$config --storage.path=/alertmanager
    volumes:
      - ./infra/monitoring/alertmanager:/etc/alertmanager:ro
    ports: ["127.0.0.1:9093:9093"]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.2.6
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  db_data:
  grafana_data:
